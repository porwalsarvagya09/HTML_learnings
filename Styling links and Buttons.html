<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pseudo selectors and more designing</title>
    <style>
        .container{
            background-color: blanchedalmond;
            border: 4px solid rgb(93, 24, 24);
            padding: 34px;
            margin: 34px auto;
            width: 600px;
        }
        a{
            text-decoration: none;
        }
        a:hover{
            color: white;
            background-color: black;
            border: 4px solid white;
        }
        button:hover{
            color: white;
            background-color: black;
            border: 4px solid white;
        }
        .btn{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: bold;
            background-color: rgb(140, 98, 46);
            padding: 5px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            border-radius: 5px;
        }
        .head{
            background-color: rgb(140, 98, 46);
            width: auto;
            padding-left: 4px;
            margin-left: 1px;
            margin-right: 395px;
        }
        a:visited{
            background-color: rgb(6, 121, 48);
        }
        a:active{
            background-color: darkorange;
        }
    </style>
  </head>
  <body>
    <div class="container" id="cont1">
      <h2 class="head">This is my heading</h2>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Illo facilis,
        deleniti soluta quaerat assumenda aut voluptatem nulla a, quibusdam
        alias rerum perferendis animi voluptas hic vero accusantium expedita
        nostrum earum mollitia nemo veniam magnam.
      </p>
      <a href="https://google.com" class="btn">Read more</a>
      <button class="btn">Contact us</button>
    </div>
  </body>
</html>
