<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute and nth Child Pseudo Selectors</title>
    <style>
        .container{
            display: block;
            width: 23%;
            margin: auto;
        }
        input{
            display: block;
        }
        input[type='text']{
            border: 2px solid red;
            padding: 20px;

        }
        a[target]{
            font-size: 40px;
            color: rgb(21, 103, 26);
        }
        a[target='_self']{
            font-size: 20px;
            font-family: 'Times New Roman', Times, serif;
            color: cornflowerblue;
        }
        input[type='email']{
            background-color: yellow;
            border: 3px solid green;
        }

        /* This will apply CSS for third child only */
        /* li:nth-child(3){
            color: rgb(110, 99, 255);

        } */
        /* li:nth-child(2n+0){
            color: rgb(252, 27, 11);

        } */

        /* ODD CHILD */
        li:nth-child(odd){
           background-color: chartreuse;
        }

        /* EVEN CHILD */
        li:nth-child(even){
            background-color: rgb(250, 96, 227);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><a href="http://google.com" target="_blank">Go to GOOGLE</a></h1>
        <h1><a href="http://facebook.com" target="_self">Go to facebook</a></h1>
        <form action="" class="form-control">
            <input type="text" placeholder="Enter your name">
            <input type="email" placeholder="Enter your email">
            <input type="password" placeholder="Enter your password">
            <input type="submit" placeholder="SUBMIT">
        </form>

        <ul>
            <li class="item" id="item-1">Item1</li>
            <li class="item" id="item-2">Item2</li>
            <li class="item" id="item-3">Item3</li>
            <li class="item" id="item-4">Item4</li>
            <li class="item" id="item-5">Item5</li>
            <li class="item" id="item-6">Item6</li>
            <li class="item" id="item-7">Item7</li>
            <li class="item" id="item-8">Item8</li>
            <li class="item" id="item-9">Item9</li>
        </ul>
    </div>
    
</body>
</html>
