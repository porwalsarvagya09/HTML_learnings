<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Property</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .container{
            display: flex;
            background-color: brown;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }
        .box{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(250, 190, 117);
            border: 2px solid black;
            border-radius: 10px;
            height: 200px;
            width: 200px;
            transition: all 0.5s ease-in-out;
        }
        .box:hover{
            background-color: rgb(188, 133, 241);
            /* transform: rotate(360deg); */
            /* transform: skew(20deg); */
            /* transform: scale(2); */
            /* transform: translateX(123px); */
            /* transform: translateY(123px); */
            transform: translate(123px, 123px);

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            This is a box
        </div>
    </div>
    
</body>
</html>
