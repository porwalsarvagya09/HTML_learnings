<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities</title>
</head>
<body>
    <div class="container">
        <p>This is a paragraph</p>
    </div>
    <br>
    <div class="container">
        <p>This is a &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Paragraph</p>
        <p>This is a Paragraph &lt;p&gt;</p>
        <p>Pound can be written like &pound;</p>
        <p>copyright can be written like &copy;</p>
        <p>Caps can be written like &caps; ;</p>
        <p>yen can be written like &#165;</p>
    </div>
    
</body>
</html>
