<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      .container {
        width: 100%;
        height: 450px;
        border: 3px solid black;
        display: flex; /* Initialize the container as flex box */

        /* Flex Properties for a Flex container */

        /* flex-direction: row; (default value of flex-direcction is row) */
        /* flex-direction: column; */
        /* flex-direction: row-reverse; */
        /* flex-direction: column-reverse; */

        /* flex-wrap: wrap; (default value of flex-direction is nowrap) */
        /* flex-wrap: wrap-reverse; */

        /* This is a shorthand for flex-direction and flex-wrap */
        /* flex-flow: row-reverse wrap; */

        /* JUSTIFY-CONTENT WILL JUSTIFY THE CONTENT IN HORIZONTAL DIRECTION */
        /* justify-content: center; */
        /* justify-content: space-between; */
        /* justify-content: space-evenly; */
        /* justify-content: space-around; */

        /* JUSTIFY-CONTENT WILL JUSTIFY THE CONTENT IN VERTICAL DIRECTION */
        /* align-items: center; */
        /* align-items: flex-end; */
        /* align-items: flex-start; */
        /* align-items: stretch; */
      }
      .item {
        width: 120px;
        height: 120px;
        background-color: yellow;
        border: 2px solid green;
        margin: 10px;
        padding: 6px;
      }
      #item1 {
        /* FLEX PROPERTIES FOR FLEX ITEM */

        /* HIGHER THE ORDER, LATER IT SHOWS UP IN THE CONTAINER  */
        /* order: 20; */

        /* flex-grow: 2; */
        /* flex-shrink: 2; */
      }
      #item2 {
        /* flex-grow: 3; */
        /* flex-shrink: 3; */

        /* WHEN FLEX-DIRECTION IS SET TO ROW THEN FLEX-BASIS CONTROL WIDTH */
        /* WHEN FLEX-DIRECTION IS SET TO COLUMN THEN FLEX-BASIS CONTROL HEIGHT */
        flex-basis: 320px;
      }
      #item3 {
        /* order: 4; */
        flex: 4 5 200px; /* flex-grow, flex-shrink, flex-basis */

        align-self: center;
        align-self: flex-end;
        align-self: flex-start;
      }
    </style>
  </head>
  <body>
    <h2>This is my Flexbox</h2>
    <div class="container">
      <div class="item" id="item1">First Box</div>
      <div class="item" id="item2">Second Box</div>
      <div class="item" id="item3">Third Box</div>
      <!-- <div class="item" id="item4">Fourth Box</div> -->
      <!-- <div class="item" id="item5">Fifth Box</div> -->
      <!-- <div class="item" id="item6">Sixth Box</div> -->
    </div>
  </body>
</html>
